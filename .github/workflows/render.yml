name: GTA6 Cloud Video Renderer

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Twitch MP4 URLs (pipe separated)'
        required: true
      hook_text:
        description: 'Hook Text (Top Banner)'
        required: true
      streamer_tag:
        description: 'Streamer Credit'
        required: true
      clip_id:
        description: 'Unique Clip ID'
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Fonts & Whisper AI
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl
          pip install --quiet faster-whisper

      - name: Download, Stitch & Render 9:16 Split-Screen Video
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          HOOK_TEXT: ${{ github.event.inputs.hook_text }}
          STREAMER_TAG: ${{ github.event.inputs.streamer_tag }}
          CLIP_ID: ${{ github.event.inputs.clip_id }}
        run: |
          python3 - << 'EOF'
          import os, subprocess
          from faster_whisper import WhisperModel

          urls = [u.strip() for u in os.environ.get("VIDEO_URL", "").split("|") if u.strip()]
          hook = os.environ.get("HOOK_TEXT", "KRASSER GTA MOMENT!").replace("\n", " ").replace("{", "").replace("}", "")
          credit = os.environ.get("STREAMER_TAG", "Credit: @Twitch").replace("\n", " ").replace("{", "").replace("}", "")
          clip_id = os.environ.get("CLIP_ID", "output")

          ts_files = []
          for idx, url in enumerate(urls):
              raw_file = f"raw_{idx}.mp4"
              ts_file = f"norm_{idx}.ts"
              subprocess.run(["curl", "-L", "--fail", "--retry", "3", "-A", "Mozilla/5.0", url, "-o", raw_file], check=True)
              # Normalisiere jeden Teil-Clip auf exakt 1280x720 @ 30fps für nahtlosen Zusammenschnitt
              norm_cmd = [
                  "ffmpeg", "-y", "-i", raw_file,
                  "-vf", "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p",
                  "-af", "aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "20",
                  "-c:a", "aac", "-b:a", "128k", "-f", "mpegts", ts_file
              ]
              subprocess.run(norm_cmd, check=True)
              ts_files.append(ts_file)

          concat_str = "concat:" + "|".join(ts_files)
          subprocess.run(["ffmpeg", "-y", "-i", concat_str, "-c", "copy", "input.mp4"], check=True)

          def fmt_time(seconds):
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = seconds % 60
              return f"{h}:{m:02d}:{s:05.2f}"

          ass_lines = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "WrapStyle: 1",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Hook,DejaVu Sans,52,&H00FFFFFF,&H00FFFFFF,&H001200E6,&H001200E6,-1,0,0,0,100,100,0,0,3,20,0,8,60,60,90,1",
              "Style: Credit,DejaVu Sans,42,&H00FFFFFF,&H00FFFFFF,&H00FF4691,&H00FF4691,-1,0,0,0,100,100,0,0,3,16,0,8,80,80,580,1",
              "Style: Subs,DejaVu Sans,68,&H0000E6FF,&H00FFFFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,8,3,2,70,70,260,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
              f"Dialogue: 2,0:00:00.00,0:00:04.50,Hook,,0,0,0,,{hook}",
              f"Dialogue: 1,0:00:00.00,0:05:00.00,Credit,,0,0,0,,{credit}"
          ]

          try:
              model = WhisperModel("base", device="cpu", compute_type="int8")
              segments, _ = model.transcribe("input.mp4", word_timestamps=True)
              for seg in segments:
                  words = seg.words or []
                  chunk = []
                  for w in words:
                      chunk.append(w)
                      if len(chunk) >= 3:
                          start_t = fmt_time(chunk[0].start)
                          end_t = fmt_time(chunk[-1].end)
                          txt = " ".join(x.word.strip() for x in chunk).upper().replace("{", "").replace("}", "")
                          ass_lines.append(f"Dialogue: 3,{start_t},{end_t},Subs,,0,0,0,,{txt}")
                          chunk = []
                  if chunk:
                      start_t = fmt_time(chunk[0].start)
                      end_t = fmt_time(chunk[-1].end)
                      txt = " ".join(x.word.strip() for x in chunk).upper().replace("{", "").replace("}", "")
                      ass_lines.append(f"Dialogue: 3,{start_t},{end_t},Subs,,0,0,0,,{txt}")
          except Exception as e:
              print("Whisper info:", e)

          with open("overlay.ass", "w", encoding="utf-8") as f:
              f.write("\n".join(ass_lines))

          # Echtes 9:16 Split-Layout: Oben (608px) volles Bild mit Cam, unten (1312px) groß herangezoomtes Gameplay
          cmd = [
              "ffmpeg", "-y", "-i", "input.mp4",
              "-filter_complex",
              "[0:v]scale=1080:608:force_original_aspect_ratio=decrease,pad=1080:608:(ow-iw)/2:(oh-ih)/2[top];"
              "[0:v]scale=-2:1312,crop=1080:1312:(iw-1080)/2:0,eq=saturation=1.05[bot];"
              "[top][bot]vstack=inputs=2,ass=overlay.ass[v]",
              "-map", "[v]", "-map", "0:a?",
              "-af", "volume=0.98",
              "-c:v", "libx264", "-preset", "veryfast", "-crf", "23", "-pix_fmt", "yuv420p",
              "-c:a", "aac", "-b:a", "128k", "-movflags", "+faststart",
              f"clip_{clip_id}.mp4"
          ]
          subprocess.run(cmd, check=True)
          EOF

      - name: Publish MP4 to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIP_ID: ${{ github.event.inputs.clip_id }}
        run: |
          gh release create latest --title "Rendered Clips" --notes "Auto-generated clips" || true
          gh release upload latest "clip_${CLIP_ID}.mp4" --clobber
