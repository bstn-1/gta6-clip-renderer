name: GTA6 Cloud Video Renderer

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Twitch MP4 URLs (pipe separated with Streamer:: prefix)'
        required: true
      hook_text:
        description: 'Hook Text (Top Banner)'
        required: true
      streamer_tag:
        description: 'Fallback Streamer Credit'
        required: true
      clip_id:
        description: 'Unique Clip ID'
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Fonts & Whisper AI
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl python3-pip
          python3 -m pip install --break-system-packages faster-whisper || pip install faster-whisper

      - name: Download, Stitch, Transcribe & Render 9:16 Video
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          HOOK_TEXT: ${{ github.event.inputs.hook_text }}
          STREAMER_TAG: ${{ github.event.inputs.streamer_tag }}
          CLIP_ID: ${{ github.event.inputs.clip_id }}
        run: |
          python3 - << 'EOF'
          import os, subprocess
          from faster_whisper import WhisperModel

          entries = [u.strip() for u in os.environ.get("VIDEO_URL", "").split("|") if u.strip()]
          hook = os.environ.get("HOOK_TEXT", "KRASSER GTA MOMENT!").replace("\n", " ").replace("{", "").replace("}", "")
          fallback_credit = os.environ.get("STREAMER_TAG", "Credit: @Twitch").replace("\n", " ").replace("{", "").replace("}", "")
          clip_id = os.environ.get("CLIP_ID", "output")

          valid_clips = []
          accumulated_dur = 0.0

          for idx, entry in enumerate(entries):
              if accumulated_dur >= 65.0:
                  break
              if "::" in entry:
                  st_name, url = entry.split("::", 1)
                  clip_credit = f"Credit: @{st_name.strip()}".replace("{", "").replace("}", "")
              else:
                  clip_credit = fallback_credit
                  url = entry

              raw_file = f"raw_{idx}.mp4"
              norm_file = f"norm_{idx}.mp4"
              
              dl = subprocess.run(["curl", "-L", "--fail", "--retry", "2", "-A", "Mozilla/5.0", url, "-o", raw_file])
              if dl.returncode != 0 or not os.path.exists(raw_file) or os.path.getsize(raw_file) < 50000:
                  print(f"Überspringe defekte URL {idx}")
                  continue

              norm_cmd = [
                  "ffmpeg", "-y", "-i", raw_file,
                  "-vf", "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p",
                  "-af", "aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "20",
                  "-c:a", "aac", "-b:a", "128k", "-ar", "44100", "-ac", "2",
                  norm_file
              ]
              if subprocess.run(norm_cmd).returncode == 0:
                  probe = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", norm_file],
                      capture_output=True, text=True
                  )
                  try:
                      dur = float(probe.stdout.strip())
                  except:
                      dur = 0.0
                  if dur > 5.0:
                      valid_clips.append((norm_file, dur, clip_credit))
                      accumulated_dur += dur
                      print(f"Clip {idx} ({clip_credit}) hinzugefügt ({dur:.1f}s) -> Gesamtdauer: {accumulated_dur:.1f}s")

          if not valid_clips:
              raise RuntimeError("Kein einziger Clip konnte geladen werden!")

          while accumulated_dur < 62.0:
              first_file, first_dur, first_cred = valid_clips[0]
              valid_clips.append((first_file, first_dur, first_cred))
              accumulated_dur += first_dur

          with open("concat_list.txt", "w", encoding="utf-8") as f:
              for mp4, _, _ in valid_clips:
                  f.write(f"file '{mp4}'\n")

          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0",
              "-i", "concat_list.txt", "-t", "75",
              "-c:v", "libx264", "-preset", "ultrafast", "-crf", "20",
              "-c:a", "aac", "-b:a", "128k",
              "stitched.mp4"
          ], check=True)

          # Stabile WAV-Extraktion ohne abstürzende Spezialfilter
          subprocess.run([
              "ffmpeg", "-y", "-i", "stitched.mp4",
              "-vn", "-af", "volume=2.0",
              "-acodec", "pcm_s16le", "-ar", "16000", "-ac", "1", "audio.wav"
          ], check=True)

          def fmt_time(seconds):
              seconds = max(0.0, float(seconds))
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = seconds % 60
              return f"{h}:{m:02d}:{s:05.2f}"

          ass_lines = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "WrapStyle: 1",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Hook,DejaVu Sans,52,&H00FFFFFF,&H00FFFFFF,&H001200E6,&H001200E6,-1,0,0,0,100,100,0,0,3,20,0,8,60,60,90,1",
              "Style: Credit,DejaVu Sans,42,&H00FFFFFF,&H00FFFFFF,&H00FF4691,&H00FF4691,-1,0,0,0,100,100,0,0,3,16,0,8,80,80,580,1",
              "Style: Subs,DejaVu Sans,70,&H0000E6FF,&H00FFFFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,9,4,2,70,70,280,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
              f"Dialogue: 2,0:00:00.00,0:00:04.50,Hook,,0,0,0,,{hook}"
          ]

          cur_t = 0.0
          for _, dur, clip_credit in valid_clips:
              if cur_t >= 75.0:
                  break
              st = fmt_time(cur_t)
              et = fmt_time(min(cur_t + dur, 75.0))
              ass_lines.append(f"Dialogue: 1,{st},{et},Credit,,0,0,0,,{clip_credit}")
              cur_t += dur

          sub_count = 0
          try:
              model = WhisperModel("base", device="cpu", compute_type="int8")
              segments, _ = model.transcribe(
                  "audio.wav",
                  beam_size=1,
                  vad_filter=False,
                  no_speech_threshold=1.0,
                  log_prob_threshold=-3.0,
                  compression_ratio_threshold=5.0,
                  condition_on_previous_text=False
              )

              for seg in segments:
                  clean_text = seg.text.strip().upper().replace("{", "").replace("}", "").replace("\\", "")
                  raw_words = [w for w in clean_text.split() if w]
                  if not raw_words:
                      continue
                  dur = max(seg.end - seg.start, 0.6)
                  chunks = [raw_words[i:i+3] for i in range(0, len(raw_words), 3)]
                  step = dur / len(chunks)
                  for idx_c, c_words in enumerate(chunks):
                      st = fmt_time(seg.start + idx_c * step)
                      et = fmt_time(seg.start + (idx_c + 1) * step)
                      ass_lines.append(f"Dialogue: 3,{st},{et},Subs,,0,0,0,,{' '.join(c_words)}")
                      sub_count += 1
          except Exception as e:
              print("Whisper Fehler:", e)

          # Garantierter Fallback, falls der Clip nur aus Ingame-Sound/Musik ohne Sprache besteht
          if sub_count == 0:
              fallback_subs = [
                  (0.5, 3.5, "SCHAUT EUCH DAS AN!"),
                  (10.0, 13.5, "WAS FÜR EIN MOMENT!"),
                  (25.0, 28.5, "KOMPLETT ESCALIERT!"),
                  (42.0, 45.5, "UNGLAUBLICHE SZENE!"),
                  (58.0, 62.0, "SCHREIBT EURE MEINUNG!")
              ]
              for st_sec, et_sec, fb_txt in fallback_subs:
                  ass_lines.append(f"Dialogue: 3,{fmt_time(st_sec)},{fmt_time(et_sec)},Subs,,0,0,0,,{fb_txt}")

          print(f"Generierte Whisper-Untertitel: {sub_count}")

          with open("overlay.ass", "w", encoding="utf-8") as f:
              f.write("\n".join(ass_lines))

          cmd = [
              "ffmpeg", "-y", "-i", "stitched.mp4",
              "-filter_complex",
              "[0:v]scale=1080:608:force_original_aspect_ratio=decrease,pad=1080:608:(ow-iw)/2:(oh-ih)/2[top];"
              "[0:v]scale=-2:1312,crop=1080:1312:(iw-1080)/2:0,eq=saturation=1.05[bot];"
              "[top][bot]vstack=inputs=2,ass=overlay.ass[v]",
              "-map", "[v]", "-map", "0:a?",
              "-af", "volume=0.98",
              "-c:v", "libx264", "-preset", "veryfast", "-crf", "23", "-pix_fmt", "yuv420p",
              "-c:a", "aac", "-b:a", "128k", "-movflags", "+faststart",
              f"clip_{clip_id}.mp4"
          ]
          subprocess.run(cmd, check=True)
          EOF

      - name: Publish MP4 to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIP_ID: ${{ github.event.inputs.clip_id }}
        run: |
          gh release create latest --title "Rendered Clips" --notes "Auto-generated clips" || true
          gh release upload latest "clip_${CLIP_ID}.mp4" --clobber
